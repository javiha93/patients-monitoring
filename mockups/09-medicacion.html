<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients Monitoring — Medicación Activa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b;display:flex;height:100vh;overflow:hidden}
.icon{width:18px;height:18px;display:inline-block;vertical-align:middle}
.sidebar{width:256px;background:#0f172a;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid #1e293b}
.sidebar-logo h1{font-size:18px;font-weight:700}
.sidebar-logo span{color:#38bdf8}
.sidebar-nav{flex:1;padding:16px 0}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#94a3b8;text-decoration:none;font-size:14px}
.sidebar-nav a:hover{color:#fff;background:#1e293b}
.sidebar-user{padding:16px 20px;border-top:1px solid #1e293b;font-size:13px;color:#94a3b8}
.sidebar-user .name{color:#fff;font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.patient-header{background:#fff;padding:16px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:16px;flex-shrink:0}
.patient-header .back-link{color:#64748b;text-decoration:none;font-size:14px;display:flex;align-items:center;gap:4px}
.patient-header .back-link:hover{color:#0f172a}
.patient-header .info{flex:1;display:flex;align-items:center;gap:12px}
.patient-header .pname{font-size:18px;font-weight:700}
.patient-header .meta{font-size:13px;color:#64748b}
.btn-now{background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.btn-now:hover{background:#0284c7}
/* Grid: single table approach for perfect row alignment */
.grid-wrapper{flex:1;overflow:auto;padding-bottom:64px}
.med-table{border-collapse:collapse;min-width:max-content}
.med-table thead{position:sticky;top:0;z-index:3}
.med-table thead th{padding:8px 0;font-size:11px;font-weight:500;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0;text-align:center}
.med-table thead th.col-label{width:240px;min-width:240px;position:sticky;left:0;z-index:4;background:#f8fafc;text-align:left;padding-left:12px}
.med-table thead th.col-hour{width:56px;min-width:56px}
.med-table .section-row td,.med-table .section-row th{background:#f8fafc;height:30px;border-bottom:1px solid #e2e8f0;border-top:1px solid #e2e8f0;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;padding-left:12px}
.med-table .section-row td{padding:0;border-right:none}
.med-table tbody th.med-label{position:sticky;left:0;z-index:1;background:#fff;width:240px;min-width:240px;padding:10px 12px;border-bottom:1px solid #f1f5f9;border-right:1px solid #e2e8f0;text-align:left;vertical-align:center}
.med-label .med-name{font-size:13px;font-weight:600;color:#1e293b}
.med-label .med-detail{font-size:11px;color:#64748b;font-weight:400}
.med-table td{width:56px;min-width:56px;height:44px;border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;text-align:center;font-size:12px;position:relative;cursor:pointer;vertical-align:middle}
.med-table td:hover{background:#f0f9ff;cursor:pointer}
.med-table tbody th.med-label{border-bottom:1px solid #e2e8f0}
.col-now{background:#dbeafe !important}
.col-midnight{border-left:2px solid #3b82f6}
.cell-pautada{color:#94a3b8;font-size:18px;cursor:pointer}
.cell-pautada:hover{color:#0ea5e9}
.cell-firmada{background:#dcfce7 !important;color:#166534;font-weight:600;font-size:12px;position:relative}
.cell-firmada:hover{background:#bbf7d0 !important}
.cell-firmada .tick{font-size:16px;color:#166534}
.cell-firmada .dose{font-size:10px;color:#15803d}
.cell-firmada .edit-icon{position:absolute;top:2px;right:2px;width:14px;height:14px;color:#64748b;opacity:0;transition:opacity .15s;cursor:pointer}
.cell-firmada:hover .edit-icon{opacity:1}
.cell-firmada .obs-dot{position:absolute;bottom:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#3b82f6}
.cell-next{color:#0ea5e9;font-size:14px;cursor:pointer;font-weight:700}
.cell-next:hover{color:#0284c7}
/* Insulin scale */
.insulin-scale{font-size:10px;margin-top:4px;font-weight:400}
.insulin-scale .scale-row{display:flex;align-items:center;gap:4px;padding:1px 0}
.insulin-scale .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.scale-td{height:20px !important;font-size:10px;color:#64748b}
.scale-td.med-label{height:20px !important;padding:2px 12px}
.scale-green{background:#f0fdf4 !important}
.scale-yellow{background:#fefce8 !important}
.scale-orange{background:#fff7ed !important}
.scale-red{background:#fef2f2 !important}
/* Action bar */
.action-bar{position:fixed;bottom:0;left:256px;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 24px;display:flex;align-items:center;gap:20px;z-index:100}
.action-bar .patient-name{font-size:14px;color:#64748b}
.action-bar .patient-name strong{color:#1e293b}
.action-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;text-decoration:none;transition:opacity .15s}
.action-btn .icon{width:22px;height:22px}
.action-btn.registros{color:#dc2626}
.action-btn.antecedentes{color:#d97706}
.action-btn.medicacion{color:#0d9488}
.action-btn:hover{opacity:.7}
.action-btn.active-tab{opacity:1}
.action-btn.active-tab .icon{stroke-width:2.5}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:16px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:24px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:12px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#64748b}
.modal-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.m-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.m-group label{font-size:12px;font-weight:500;color:#475569}
.m-group input,.m-group textarea{padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.m-group textarea{resize:vertical;min-height:60px}
.m-info{background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:12px;color:#64748b;margin-bottom:12px}
.m-info strong{color:#1e293b}
.m-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid #f1f5f9}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.btn-cancel{background:#f1f5f9;color:#475569}
.btn-primary{background:#0ea5e9;color:#fff}
.btn-danger{background:#dc2626;color:#fff;font-size:12px;padding:6px 12px}
</style>
</head>
<body>
<aside class="sidebar">
<div class="sidebar-logo"><h1><span>P</span>atients <span>M</span>onitoring</h1></div>
<nav class="sidebar-nav"><a href="02-lista-pacientes.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Pacientes</a></nav>
<div class="sidebar-user"><div class="name">Javi Herrada Álvarez</div><div>Enfermería</div></div>
</aside>
<div class="main">
<div class="patient-header">
<a href="02-lista-pacientes.html" class="back-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Lista</a>
<div class="info"><div><div class="pname">Martínez Ruiz, Pedro</div><div class="meta">58 años · NHC-002345</div></div></div>
<button class="btn-now" onclick="scrollToNow()">Ahora</button>
</div>
<div class="grid-wrapper" id="gridWrapper"></div>
</div>
<div class="action-bar">
<a class="action-btn registros" href="03-ficha-paciente.html" title="Registros"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></a>
<a class="action-btn antecedentes" href="08-antecedentes.html" title="Antecedentes"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10.01h.01"/><path d="M10 14.01h.01"/><path d="M14 10.01h.01"/><path d="M14 14.01h.01"/><path d="M18 6v11.5"/><path d="M6 6v12"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg></a>
<a class="action-btn medicacion active-tab" href="#" title="Medicación"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg></a>
<div class="patient-name"><strong>Martínez Ruiz, Pedro</strong> · NHC-002345</div>
</div>
<!-- Modal: Firmar insulina -->
<div class="modal-backdrop" id="insulinModal" onclick="if(event.target===this)closeInsulin()">
<div class="modal">
<div class="modal-header"><div><h3>Firmar insulina</h3></div><button class="modal-close" onclick="closeInsulin()">✕</button></div>
<div class="m-info"><strong>Insulina rápida (Actrapid) SC</strong><br>Última glucemia: <strong>126 mg/dL</strong> (hace 1h 30min)</div>
<div class="m-group"><label>Dosis administrada (UI) *</label><input type="number" id="insulinDose" placeholder="Ej: 4"></div>
<div class="m-group"><label>Anotación (opcional)</label><textarea placeholder="Observaciones..."></textarea></div>
<div class="m-actions"><button class="btn btn-cancel" onclick="closeInsulin()">Cancelar</button><button class="btn btn-primary" onclick="confirmarInsulin()">Firmar</button></div>
</div>
</div>
<!-- Modal: Editar administración -->
<div class="modal-backdrop" id="editModal" onclick="if(event.target===this)closeEdit()">
<div class="modal">
<div class="modal-header"><div><h3>Editar administración</h3></div><button class="modal-close" onclick="closeEdit()">✕</button></div>
<div class="m-info" id="editInfo"></div>
<div class="m-group"><label>Dosis administrada</label><div style="display:flex;align-items:center;gap:8px"><input type="number" id="editDoseNum" placeholder="Ej: 1" style="flex:1"><span id="editDoseUnit" style="font-size:14px;font-weight:500;color:#1e293b"></span></div></div>
<div class="m-group"><label>Observaciones</label><textarea id="editObs" placeholder="Añadir observaciones..."></textarea></div>
<div class="m-actions"><button class="btn btn-cancel" onclick="closeEdit()">Cancelar</button><button class="btn btn-primary" onclick="saveEdit()">Guardar</button></div>
</div>
</div>
<script>
const now = new Date();
const NOW_HOUR = now.getHours();
const today = new Date(now); today.setHours(0,0,0,0);
const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
const days = [yesterday, today, tomorrow];
const fmt = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

const meds = [
  {section:'Medicación fija', items:[
    {name:'Paracetamol', detail:'1g EV c/8h', freq:8, start:0, unit:'g'},
    {name:'Metilprednisolona', detail:'20mg EV c/24h', freq:24, start:8, unit:'mg'},
    {name:'Amoxicilina/Clavulánico', detail:'1g/200mg EV c/8h', freq:8, start:2, unit:'mg'},
  ]},
  {section:'Medicación condicional', items:[
    {name:'Dexketoprofeno', detail:'50mg EV si dolor (máx c/8h)', freq:0, conditional:true, unit:'mg'},
  ]},
  {section:'Sueroterapia', items:[
    {name:'Suero fisiológico 0.9%', detail:'500ml EV c/12h', freq:12, start:6, unit:'ml'},
  ]},
  {section:'Pauta de insulina', items:[
    {name:'Insulina rápida (Actrapid)', detail:'SC s/pauta c/6h', freq:6, start:6, insulin:true},
  ]},
];

const hours = [];
for (let d=0; d<3; d++) for (let h=0; h<24; h++) hours.push({day:d, hour:h, label:`${String(h).padStart(2,'0')}:00`, dayLabel:fmt(days[d])});

// Flatten meds to get a global index
const flatMeds = [];
meds.forEach(sec => sec.items.forEach(m => flatMeds.push(m)));

// Signatures state
const signatures = {};
function sk(mi,d,h){ return `${mi}-${d}-${h}`; }

// Pre-populate past signatures for scheduled meds
flatMeds.forEach((m, mi) => {
  if (m.conditional) {
    signatures[sk(mi,0,14)] = {user:'Javi Herrada', time:'14:12', dose:'50mg'};
    signatures[sk(mi,1,Math.max(0,NOW_HOUR-4))] = {user:'Javi Herrada', time:String(Math.max(0,NOW_HOUR-4)).padStart(2,'0')+':05', dose:'50mg'};
  } else if (m.freq > 0) {
    for (let d=0; d<3; d++) {
      for (let h=0; h<24; h++) {
        if ((d*24+h - m.start) % m.freq === 0) {
          if (d < 1 || (d === 1 && h < NOW_HOUR)) {
            const mm = String(Math.floor(Math.random()*50)+5).padStart(2,'0');
            signatures[sk(mi,d,h)] = {user:'Javi Herrada', time:`${String(h).padStart(2,'0')}:${mm}`, dose: m.insulin ? '4UI' : ''};
          }
        }
      }
    }
  }
});

// Calculate suggested doses based on last signature
function findSuggested(mi) {
  const m = flatMeds[mi];
  if (m.conditional || m.freq === 0) return new Set();

  // Find the last signed hour (absolute)
  let lastSigned = -1;
  for (let d=2; d>=0; d--) {
    for (let h=23; h>=0; h--) {
      if (signatures[sk(mi,d,h)]) {
        lastSigned = d*24 + h;
        break;
      }
    }
    if (lastSigned >= 0) break;
  }

  const nowAbs = 1*24 + NOW_HOUR; // day 1 = today
  const suggested = new Set();
  if (lastSigned < 0) {
    // No signatures at all — use original schedule, only from now onwards
    for (let d=0; d<3; d++) {
      for (let h=0; h<24; h++) {
        const abs = d*24 + h;
        if (abs >= nowAbs && (abs - m.start) % m.freq === 0) {
          suggested.add(`${d}-${h}`);
        }
      }
    }
  } else {
    // Calculate from last signed hour, only from now onwards
    let next = lastSigned + m.freq;
    while (next < 72) {
      const d = Math.floor(next / 24);
      const h = next % 24;
      if (d < 3 && next >= nowAbs && !signatures[sk(mi,d,h)]) {
        suggested.add(`${d}-${h}`);
      }
      next += m.freq;
    }
  }
  return suggested;
}

function render() {
  const scaleLabels = ['<150: 0UI','150-250: 2UI','250-350: 4UI','>350: 6UI'];

  let html = '<table class="med-table"><thead><tr><th class="col-label"></th>';
  hours.forEach((h,i) => {
    let cls = 'col-hour';
    if (h.day===1 && h.hour===NOW_HOUR) cls += ' col-now';
    if (h.hour===0 && i>0) cls += ' col-midnight';
    html += `<th class="${cls}" id="h${i}">${h.hour===0 ? h.dayLabel+'<br>' : ''}${h.label}</th>`;
  });
  html += '</tr></thead><tbody>';

  let mi = 0;
  meds.forEach(sec => {
    // Section header row
    html += `<tr class="section-row"><th class="med-label" style="text-transform:uppercase;letter-spacing:.5px;font-size:11px;font-weight:600;color:#64748b">${sec.section}</th>`;
    hours.forEach(() => html += '<td></td>');
    html += '</tr>';

    sec.items.forEach(m => {
      const currentMi = mi;
      const suggested = findSuggested(currentMi);

      // Main med row
      html += `<tr><th class="med-label"><div class="med-name">${m.name}</div><div class="med-detail">${m.detail}</div>`;
      if (m.insulin) {
        html += `<div class="insulin-scale">`;
        scaleLabels.forEach((l,si) => {
          const colors = ['#16a34a','#ca8a04','#ea580c','#dc2626'];
          html += `<div class="scale-row"><span class="dot" style="background:${colors[si]}"></span> ${l}</div>`;
        });
        html += `</div>`;
      }
      html += `</th>`;

      hours.forEach((h,i) => {
        let cls = '';
        if (h.day===1 && h.hour===NOW_HOUR) cls = 'col-now';
        if (h.hour===0 && i>0) cls += ' col-midnight';

        const key = sk(currentMi, h.day, h.hour);
        const sig = signatures[key];
        let content = '';

        const isSuggested = suggested.has(`${h.day}-${h.hour}`);

        if (sig) {
          cls += ' cell-firmada';
          let tooltipParts = [`${sig.user} · ${sig.time}`];
          if (sig.doseVal) tooltipParts.push(`Dosis: ${sig.doseVal}`);
          if (sig.obs) tooltipParts.push(`Obs: ${sig.obs}`);
          const tooltip = tooltipParts.join('\n');
          const editIcon = !m.insulin ? `<svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick="event.stopPropagation();openEdit(${currentMi},${h.day},${h.hour})"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>` : '';
          const displayDose = sig.doseVal || sig.dose;
          const obsDot = sig.obs ? '<span class="obs-dot"></span>' : '';
          content = `${editIcon}${obsDot}<span class="tick">✓</span>${displayDose ? '<br><span class="dose">'+displayDose+'</span>' : ''}`;
          html += `<td class="${cls}" title="${tooltip}" onclick="desfirmar(${currentMi},${h.day},${h.hour})">${content}</td>`;
        } else {
          if (isSuggested) {
            content = `<span class="cell-next">▶</span>`;
          }
          html += `<td class="${cls}" onclick="firmar(${currentMi},${h.day},${h.hour},${m.conditional||false},${m.insulin||false})">${content}</td>`;
        }
      });
      html += '</tr>';

      
      mi++;
    });
  });

  html += '</tbody></table>';
  document.getElementById('gridWrapper').innerHTML = html;
}

function firmar(mi, day, hour, isConditional, isInsulin) {
  if (isInsulin) {
    window._pendingFirma = {mi, day, hour};
    document.getElementById('insulinModal').classList.add('show');
    return;
  }
  const t = new Date();
  const timeStr = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  signatures[sk(mi, day, hour)] = {user:'Javi Herrada', time: timeStr, dose: isConditional ? '50mg' : ''};
  render();
}

function desfirmar(mi, day, hour) {
  delete signatures[sk(mi, day, hour)];
  render();
}

function confirmarInsulin() {
  const f = window._pendingFirma;
  if (f) {
    const dose = document.getElementById('insulinDose').value || '4';
    const t = new Date();
    const timeStr = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    signatures[sk(f.mi, f.day, f.hour)] = {user:'Javi Herrada', time: timeStr, dose: dose+'UI'};
    document.getElementById('insulinDose').value = '';
  }
  document.getElementById('insulinModal').classList.remove('show');
  render();
}

function closeInsulin() {
  document.getElementById('insulinModal').classList.remove('show');
}

function openEdit(mi, day, hour) {
  const sig = signatures[sk(mi, day, hour)];
  const m = flatMeds[mi];
  if (!sig) return;
  window._editTarget = {mi, day, hour};
  document.getElementById('editInfo').innerHTML = `<strong>${m.name}</strong> — ${m.detail}<br>Firmado: ${sig.user} · ${sig.time}`;
  const parsed = (sig.doseVal || '').match(/^([\d.]+)/);
  document.getElementById('editDoseNum').value = parsed ? parsed[1] : '';
  document.getElementById('editDoseUnit').textContent = m.unit || '';
  document.getElementById('editObs').value = sig.obs || '';
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
}

function saveEdit() {
  const t = window._editTarget;
  if (!t) return;
  const sig = signatures[sk(t.mi, t.day, t.hour)];
  if (!sig) return;
  const num = document.getElementById('editDoseNum').value.trim();
  const m = flatMeds[t.mi];
  const doseVal = num ? num + (m.unit || '') : '';
  const obs = document.getElementById('editObs').value.trim();
  sig.doseVal = doseVal;
  sig.obs = obs;
  closeEdit();
  render();
}

function scrollToNow() {
  const nowIdx = hours.findIndex(h => h.day===1 && h.hour===NOW_HOUR);
  const th = document.getElementById('h'+nowIdx);
  if (th) th.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

render();
setTimeout(scrollToNow, 300);
</script>
</body>
</html>
